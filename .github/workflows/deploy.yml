name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Stamp the commit into every local asset URL. Pages caches index.html
      # and its assets separately for 10 minutes, so without this a visitor
      # can hold a fresh page that still loads a stale script.
      - name: Cache-bust asset URLs
        run: |
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html
          echo "Stamped ?v=${GITHUB_SHA::8}"
          grep -c "?v=${GITHUB_SHA::8}" index.html

      # No build step — the site is plain HTML/CSS/JS served as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
